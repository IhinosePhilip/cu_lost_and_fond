services:
  - type: web
    name: cu-lost-and-found
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cu-lostfound-db
          property: connectionString

databases:
  - name: cu-lostfound-db
    databaseName: cu_lostfound
    user: cu_admin
